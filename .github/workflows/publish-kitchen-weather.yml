name: Publish Kitchen Weather

on:
  schedule:
    # Keep the hourly refresh away from the start-of-hour queue.
    - cron: '17 * * * *'
  workflow_dispatch:
  # Independent opportunities when scheduled weather runs are delayed/dropped.
  workflow_run:
    workflows: [Combine Family Calendars, Publish Kitchen Photos, Kitchen validation]
    types: [completed]
    branches: [main]

concurrency:
  group: kitchen-weather-publication
  cancel-in-progress: false

jobs:
  publish-kitchen-weather:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.event != 'pull_request'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install feed dependencies
        run: pip install requests

      - name: Build the local weather feed
        id: weather
        continue-on-error: true
        run: python scripts/publish-kitchen-weather.py

      - name: Build the Daily Brief feed
        run: python scripts/publish-kitchen-brief.py

      - name: Commit and push updated kitchen feeds
        run: |
          git add family/kitchen-weather.json family/kitchen-brief.json
          if git diff --staged --quiet; then
            exit 0
          fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "Update kitchen weather [automated]"
          bash scripts/push-kitchen-weather.sh

      - name: Report weather refresh failure after publishing available feeds
        if: always() && steps.weather.outcome == 'failure'
        run: |
          echo 'Weather refresh failed; previous weather retained. See the weather step for failure class/status.' >&2
          exit 1
