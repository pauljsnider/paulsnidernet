name: Publish Kitchen Weather

on:
  schedule:
    # Avoid the daily photo job at 6:15 UTC while keeping weather hourly.
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  publish-kitchen-weather:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Build the local weather and Daily Brief feeds
        run: |
          pip install requests
          python scripts/publish-kitchen-weather.py
          python scripts/publish-kitchen-brief.py

      - name: Commit and push updated kitchen feeds
        run: |
          git add family/kitchen-weather.json family/kitchen-brief.json
          if git diff --staged --quiet; then
            exit 0
          fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "Update kitchen weather [automated]"
          git push
