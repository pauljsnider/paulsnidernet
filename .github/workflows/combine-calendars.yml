name: Combine Family Calendars

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  push:
    branches-ignore:
      - 'kitchen-weekly/**'
    paths:
      - 'family/*.ics'
      - 'scripts/combine-calendars.py'
      - 'scripts/project-kitchen-birthdays.py'
  workflow_dispatch:  # Allow manual triggering

jobs:
  combine-calendars:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests icalendar pytz python-dateutil

      - name: Merge school events and yearly birthdays
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path('family/family-email-events.ics')
          for source_path in ('family/ote-important-events.ics', 'family/family-birthdays.ics'):
              source = Path(source_path)
              if source.exists():
                  target_text = target.read_text()
                  source_text = source.read_text()
                  marker = 'BEGIN:VEVENT'
                  if marker in source_text:
                      event_body = marker + source_text.split(marker, 1)[1]
                      event_body = event_body.rsplit('END:VCALENDAR', 1)[0].rstrip()
                      target.write_text(
                          target_text.replace(
                              'END:VCALENDAR',
                              event_body + '\nEND:VCALENDAR',
                              1,
                          )
                      )
          PY

      - name: Run calendar combining script
        env:
          WILL_BASKETBALL_ICS_URL: ${{ secrets.WILL_BASKETBALL_ICS_URL }}
          MADISON_BASKETBALL_ICS_URL: ${{ secrets.MADISON_BASKETBALL_ICS_URL }}
          MAX_BASKETBALL_ICS_URL: ${{ secrets.MAX_BASKETBALL_ICS_URL }}
        run: |
          python scripts/combine-calendars.py
          python scripts/project-kitchen-birthdays.py

      - name: Check for changes
        id: check_changes
        run: |
          git add family/family-calendar-combined.ics family/kitchen-events.json
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "Update combined family calendar [automated]"
          git push


