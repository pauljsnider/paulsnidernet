name: Kitchen validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  kitchen-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_kitchen_weekly.js
      - run: node tests/test_kitchen_publisher.js
      - run: node tests/test_kitchen_completion.js
      - name: Test family calendar views and all-day intervals
        run: |
          curl --fail --silent --show-error --location https://unpkg.com/ical.js@2.2.1/dist/ical.es5.min.cjs --output "$RUNNER_TEMP/ical-2.2.1.cjs"
          ICAL_JS_PATH="$RUNNER_TEMP/ical-2.2.1.cjs" node tests/test_family_events.js
      - name: Validate any published notes
        run: |
          node - <<'JS'
          const fs = require('fs');
          const schema = require('./family/kitchen-weekly.js');
          const path = 'family/kitchen-weekly.json';
          if (fs.existsSync(path) && !schema.validate(JSON.parse(fs.readFileSync(path)))) {
            throw new Error('Public weekly payload failed schema/finance validation');
          }
          JS
