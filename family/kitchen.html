<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="icon" href="../images/logo.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../images/logo.png">
    <title>Snider Family Board</title>
    <style>
        /*
         * The display is intentionally self-contained: no web fonts, icon
         * libraries, CSS grid, or modern JavaScript are required. It is sized
         * first for an iPad mini 2 in landscape, then reflows for portrait.
         */
        * { box-sizing: border-box; }
        html, body { width: 100%; min-height: 100%; margin: 0; }
        body {

        .hero-copy { flex: 1; -webkit-flex: 1; min-width: 0; padding-right: 22px; }
        #hero-kicker { color: #f3b96d; font-size: 13px; font-weight: 700; letter-spacing: 2.2px; margin-bottom: 8px; text-transform: uppercase; }
        #hero-title { color: #ffffff; font-family: Georgia, serif; font-size: 42px; font-weight: normal; letter-spacing: -0.6px; line-height: 1.05; margin: 0; }
        #hero-detail { color: #c5d0d8; font-size: 19px; line-height: 1.25; margin-top: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #hero-time {

        #screen-content { min-height: 314px; padding-top: 19px; }

        .photo-stage {

        .brief-view .hero, .school-view .hero { display: none; }
        .brief-view #screen-content, .school-view #screen-content { height: calc(100vh - 142px); min-height: 0; padding-top: 0; }
        .brief-panel, .school-panel {
            width: 100%;
            height: 100%;

            padding: 25px 28px;
            overflow: hidden;
            border: 1px solid rgba(246, 235, 219, 0.16);
            border-radius: 16px;

        }
        .brief-top {
            min-height: 74px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(246, 235, 219, 0.13);
        }
        .brief-kicker, .school-kicker { color: #f3b96d; font-size: 13px; font-weight: 700; letter-spacing: 2.2px; text-transform: uppercase; }
        .brief-heading, .school-heading { color: #ffffff; font-family: Georgia, serif; font-size: 34px; font-weight: normal; letter-spacing: -0.5px; line-height: 1; margin-top: 8px; }
        .brief-columns { display: -webkit-flex; display: flex; flex-wrap: wrap; -webkit-flex-wrap: wrap; margin: 16px -7px 0; }
        .brief-card {
            width: calc(33.333% - 14px);
            min-height: 202px;
            margin: 0 7px 14px;
            padding: 16px 18px;
            overflow: hidden;
            border: 1px solid rgba(246, 235, 219, 0.12);
            border-top: 4px solid #5b9fc1;

        }
        .brief-card.local { border-top-color: #7dbf8b; }
        .brief-card.kc { border-top-color: #c28ec5; }
        .brief-card.ai { border-top-color: #7aaed0; }
        .brief-card.markets { border-top-color: #f3b96d; }
        .brief-card.ticker { border-top-color: #d9b35d; }
        .brief-card-label { color: #aeb9c5; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
        .brief-card-title { color: #ffffff; font-family: Georgia, serif; font-size: 20px; line-height: 1.13; margin-top: 12px; }
        .brief-card-detail { color: #aeb9c5; font-size: 13px; line-height: 1.3; margin-top: 10px; }
        .brief-card-source { color: #6f8190; font-size: 12px; margin-top: 10px; }
        .brief-empty { color: #aeb9c5; font-family: Georgia, serif; font-size: 18px; line-height: 1.2; margin-top: 16px; }
        .market-row { display: -webkit-flex; display: flex; align-items: baseline; -webkit-align-items: baseline; justify-content: space-between; -webkit-justify-content: space-between; padding: 11px 0 8px; border-bottom: 1px solid rgba(246, 235, 219, 0.12); }
        .market-row:last-child { border-bottom: none; }
        .market-name { color: #d9e1e7; font-size: 15px; font-weight: 700; }
        .market-value { color: #ffffff; font-family: Georgia, serif; font-size: 20px; text-align: right; }
        .market-change { color: #7dbf8b; font-size: 12px; font-weight: 700; margin-top: 3px; text-align: right; }
        .market-change.down { color: #e49d99; }
        .ticker-value { color: #ffffff; font-family: Georgia, serif; font-size: 35px; letter-spacing: -0.7px; line-height: 1; margin-top: 19px; }
        .ticker-change { color: #7dbf8b; font-size: 15px; font-weight: 700; margin-top: 8px; }
        .ticker-change.down { color: #e49d99; }
        .school-intro { color: #aeb9c5; font-size: 16px; margin: 11px 0 17px; }
        .school-list { border-top: 1px solid rgba(246, 235, 219, 0.13); }
        .school-row { display: -webkit-flex; display: flex; min-height: 68px; align-items: center; -webkit-align-items: center; border-bottom: 1px solid rgba(246, 235, 219, 0.13); }
        .school-date { color: #f3b96d; font-size: 15px; font-weight: 700; line-height: 1.3; min-width: 134px; }
        .school-copy { flex: 1; -webkit-flex: 1; min-width: 0; }
        .school-title { color: #ffffff; font-size: 19px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .school-detail { color: #aeb9c5; font-size: 14px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bottomline {
            min-height: 32px;
            align-items: flex-end;
            -webkit-align-items: flex-end;
            justify-content: space-between;
            -webkit-justify-content: space-between;
        }
        #feed-status { color: #6f8190; font-size: 13px; }
        .view-controls { white-space: nowrap; }
        .view-control {
            width: 10px;
            height: 10px;
            padding: 0;
            margin-left: 9px;
            border: 1px solid #758695;
            border-radius: 50%;
            background: transparent;
            cursor: pointer;
            vertical-align: middle;
        }
        .view-control.active { background: #f3b96d; border-color: #f3b96d; }
        .paused-note { color: #f3b96d; font-size: 13px; font-weight: 700; margin-right: 12px; }
        .fade-in { -webkit-animation: fadeIn 450ms ease-out; animation: fadeIn 450ms ease-out; }
        @-webkit-keyframes fadeIn { from { opacity: 0.2; } to { opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0.2; } to { opacity: 1; } }

        @media screen and (max-width: 760px), screen and (orientation: portrait) {
            body { overflow: auto; }
            #family-board { min-height: 100vh; padding: 20px 22px; }
            #clock { font-size: 34px; }
            #date-label { font-size: 16px; }
            .weather-summary { margin-right: 14px; }
            #weather-temperature { font-size: 25px; }
            #weather-forecast { display: none; }
            .weather-days { display: none; }
            .hero { min-height: 177px; padding: 21px; }
            #hero-title { font-size: 31px; }
            #hero-time { font-size: 38px; }
            #hero-detail { font-size: 16px; }
            #screen-content { min-height: 0; }

            .event-title { font-size: 17px; }
            .event-location { font-size: 13px; }
            .week-day { min-width: 88px; font-size: 13px; }
            .week-event { font-size: 14px; max-width: 190px; }
            .upcoming-card { width: calc(50% - 16px); min-height: 175px; }
            .person-label { display: none; }
            .photo-view #screen-content, .brief-view #screen-content, .school-view #screen-content { height: calc(100vh - 116px); }
            .photo-stage { min-height: 360px; }
            .photo-title { font-size: 31px; }
            .brief-panel, .school-panel { min-height: 360px; padding: 20px; }
            .brief-heading, .school-heading { font-size: 29px; }
            .brief-columns { margin-top: 15px; }
            .brief-card { min-height: 190px; padding: 15px; }
            .brief-card-title { font-size: 18px; }
            .school-date { min-width: 100px; font-size: 13px; }

</head>
<body>
    <main id="family-board" aria-live="polite">
        <div class="topline">
            <div>
                <div class="brand">Snider Family</div>
                <div id="date-label"></div>
            </div>
            <div id="weather-summary" class="weather-summary" aria-live="polite">
                <div id="weather-temperature">—</div>
                <div class="weather-copy">
                    <div id="weather-condition"></div>
                    <div id="weather-forecast"></div>
                </div>
                <div id="weather-days" class="weather-days"></div>
            </div>
            <div>
                <div id="clock"></div>
                <div id="screen-label" class="screen-label">Today</div>
            </div>
        </div>

        <section class="hero" aria-label="Next family event">
            <div class="hero-copy">
                <div id="hero-kicker">Loading schedule</div>
                <h1 id="hero-title">One moment</h1>
                <div id="hero-detail">Checking the family calendar…</div>
            </div>
            <div>
                <div id="hero-time">—</div>
                <div id="hero-time-label">Family board</div>
            </div>
        </section>

        <section id="screen-content" aria-label="Calendar details"></section>

        <div class="bottomline">
            <div id="feed-status">Schedules refresh automatically</div>
            <div class="view-controls" aria-label="Calendar display views">
                <span id="paused-note" class="paused-note" aria-live="polite"></span>
                <button class="view-control active" data-view="0" aria-label="Show today"></button>
                <button class="view-control" data-view="1" aria-label="Show this week"></button>
                <button class="view-control" data-view="2" aria-label="Show upcoming events"></button>
                <button class="view-control" data-view="3" aria-label="Show family photos"></button>
                <button class="view-control" data-view="4" aria-label="Show the Daily Brief"></button>
                <button class="view-control" data-view="5" aria-label="Show the Overland Trail Elementary schedule"></button>
            </div>
        </div>
    </main>

    <script>
        (function () {
            'use strict';

            var FEED_URL = 'kitchen-events.json';
            var STORAGE_KEY = 'snider-family-kitchen-feed-v1';
            var PHOTO_FEED_URL = 'kitchen-photos.json';
            var PHOTO_STORAGE_KEY = 'snider-family-kitchen-photos-v1';
            var WEATHER_FEED_URL = 'kitchen-weather.json';
            var WEATHER_STORAGE_KEY = 'snider-family-kitchen-weather-v1';
            var BRIEF_FEED_URL = 'kitchen-brief.json';
            var BRIEF_STORAGE_KEY = 'snider-family-kitchen-brief-v1';
            var VIEW_NAMES = ['Today', 'This Week', 'Coming Up', 'Family Photos', 'Daily Brief', 'OTE School'];
            var VIEW_DURATIONS = [30000, 22000, 22000, 18000, 26000, 24000];
            var DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            var MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            var state = { events: [], generatedAt: null, photos: [], photosGeneratedAt: null, weather: null, weatherGeneratedAt: null, brief: null, briefGeneratedAt: null, photoIndex: 0, view: 0, rotationTimer: null, paused: false, visibleDay: null };

            function getById(id) { return document.getElementById(id); }
            function addClass(element, className) { element.className += (element.className ? ' ' : '') + className; }
            function clearElement(element) { while (element.firstChild) { element.removeChild(element.firstChild); } }
            function createElement(name, className, text) {
                var element = document.createElement(name);
                if (className) { element.className = className; }
                if (typeof text !== 'undefined') { element.textContent = text; }
                return element;
            }
            function pad(number) { return number < 10 ? '0' + number : String(number); }
            function calendarDayKey(date) { return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()); }

            function parseDate(value, allDay) {
                if (allDay) {
                    var parts = value.split('-');
                    return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
                }
                return new Date(value);
            }
            function normaliseEvents(events) {
                var normalised = [];
                var index;
                for (index = 0; index < events.length; index += 1) {
                    var event = events[index];
                    event.startDate = parseDate(event.start, event.all_day);
                    event.endDate = parseDate(event.end, event.all_day);
                    if (!isNaN(event.startDate.getTime())) { normalised.push(event); }
                }
                normalised.sort(function (first, second) { return first.startDate.getTime() - second.startDate.getTime(); });
                return normalised;
            }
            function startOfDay(date) { return new Date(date.getFullYear(), date.getMonth(), date.getDate()); }
            function isSameDay(first, second) {
                return first.getFullYear() === second.getFullYear() && first.getMonth() === second.getMonth() && first.getDate() === second.getDate();
            }
            function formatTime(date) {
                var hour = date.getHours();
                var minutes = date.getMinutes();
                var suffix = hour >= 12 ? 'PM' : 'AM';
                hour = hour % 12 || 12;
                return hour + ':' + pad(minutes) + ' ' + suffix;
            }
            function formatShortDay(date) { return DAY_NAMES[date.getDay()].slice(0, 3) + ', ' + MONTH_NAMES[date.getMonth()].slice(0, 3) + ' ' + date.getDate(); }
            function formatLongDate(date) { return DAY_NAMES[date.getDay()] + ', ' + MONTH_NAMES[date.getMonth()] + ' ' + date.getDate(); }
            function eventTime(event) { return event.all_day ? 'All day' : formatTime(event.startDate); }
            function formatWeatherDay(value) {
                var parts = String(value || '').split('-');
                if (parts.length !== 3) { return ''; }
                var date = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
                return isNaN(date.getTime()) ? '' : DAY_NAMES[date.getDay()].slice(0, 3);
            }
            function photoViewAvailable() { return state.photos.length > 0; }
            function viewAvailable(view) { return view !== 3 || photoViewAvailable(); }
            function nextView(view) {
                var candidate = view;
                var attempts = 0;
                do {

                    if (completed) { return; }
                    completed = true;
                    applyBriefFeed(readCachedBrief(), true);
                }
                request.onreadystatechange = function () {
                    if (request.readyState !== 4 || completed) { return; }
                    if (request.status < 200 || request.status >= 300) {
                        fail();
                        return;
                    }
                    try {
                        var feed = JSON.parse(request.responseText);
                        completed = true;
                        cacheBrief(feed);
                        applyBriefFeed(feed, false);
                    } catch (error) {
                        fail();
                    }
                };
                request.onerror = fail;
                request.ontimeout = fail;
                request.open('GET', BRIEF_FEED_URL + '?v=' + new Date().getTime(), true);
                request.timeout = 20000;
                request.send(null);
            }
            function initialiseControls() {
                var controls = document.querySelectorAll('.view-control');
                var index;
                for (index = 0; index < controls.length; index += 1) {
                    controls[index].addEventListener('click', function (event) {
                        event.stopPropagation();
                        var view = parseInt(this.getAttribute('data-view'), 10);
                        if (viewAvailable(view)) { chooseView(view, true); }
                    });
                }
                getById('family-board').addEventListener('click', function () {
                    if (state.view === 3 && state.photos.length) { state.photoIndex = (state.photoIndex + 1) % state.photos.length; }
                    chooseView(nextView(state.view), true);
                });
            }

            initialiseControls();
            updateClock();
            window.setInterval(updateClock, 15000);
            window.setInterval(loadFeed, 15 * 60 * 1000);
            window.setInterval(loadPhotoFeed, 15 * 60 * 1000);
            window.setInterval(loadWeatherFeed, 15 * 60 * 1000);
            window.setInterval(loadBriefFeed, 15 * 60 * 1000);
            loadFeed();
            loadPhotoFeed();
            loadWeatherFeed();
            loadBriefFeed();
            scheduleRotation();
        }());
    </script>
</body>
</html>
